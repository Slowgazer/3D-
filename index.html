<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童趣绘本3D - PLY查看器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg-color:#121212;--bg-gradient-center:#1a1a1a;--glass-surface:rgba(20,20,20,0.6);--glass-border:rgba(255,255,255,0.08);--glass-highlight:rgba(255,255,255,0.05);--accent-primary:#d4af37;--accent-glow:rgba(212,175,55,0.15);--text-main:#e0e0e0;--text-muted:#666;--font-serif:'Cormorant Garamond','Noto Serif SC',serif;--font-ui:'Inter','Noto Serif SC',sans-serif;}
        body{margin:0;overflow:hidden;background-color:var(--bg-color);font-family:var(--font-ui);color:var(--text-main);-webkit-font-smoothing:antialiased;font-weight:300;}
        #canvas-container{width:100vw;height:100vh;display:block;background:radial-gradient(circle at center,var(--bg-gradient-center) 0%,var(--bg-color) 80%);}




        #bottom-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;background:var(--glass-surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:4px;transition:opacity 0.4s;}
        .tab-btn{background:transparent;border:none;color:var(--text-muted);font-family:var(--font-ui);font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all 0.25s;white-space:nowrap;}
        .tab-btn:hover{color:var(--text-main);background:rgba(255,255,255,0.04);}
        .tab-btn.active{color:#000;background:var(--accent-primary);box-shadow:0 0 12px var(--accent-glow);}

        #panel-content{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:15;background:var(--glass-surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:16px 20px;min-width:420px;transition:opacity 0.35s,transform 0.35s;opacity:0;transform:translateX(-50%) translateY(10px);pointer-events:none;}
        #panel-content.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

        .panel-inner{display:none;}
        .panel-inner.active{display:block;}

        .ctrl-row{display:flex;align-items:center;gap:24px;margin-bottom:10px;}
        .ctrl-row:last-child{margin-bottom:0;}
        .ctrl-group{display:flex;flex-direction:column;flex:1;min-width:0;}
        .ctrl-group label{font-size:0.55rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
        .ctrl-group input[type="range"]{-webkit-appearance:none;width:100%;height:2px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0;cursor:pointer;}
        .ctrl-group input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--text-main);border-radius:50%;transition:transform 0.2s,background 0.2s;margin-top:-4px;}
        .ctrl-group input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.5);background:var(--accent-primary);}
        .ctrl-group input[type="range"]::-webkit-slider-runnable-track{height:2px;background:transparent;}
        .ctrl-actions{display:flex;align-items:center;gap:8px;justify-content:center;}
        .ctrl-btn{background:transparent;border:none;color:var(--text-main);cursor:pointer;padding:6px;border-radius:50%;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
        .ctrl-btn:hover{color:var(--accent-primary);background:rgba(255,255,255,0.04);}
        .ctrl-btn.active{color:#000;background:var(--accent-primary);box-shadow:0 0 10px var(--accent-glow);}
        .ctrl-btn svg{width:16px;height:16px;}
        #flow-sub{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);}
        .effect-sub{display:none;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);}
        .effect-sub.active{display:block;}
        .effect-sub .ctrl-row{margin-bottom:0;}
        .effect-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:0.6rem;letter-spacing:0.5px;transition:all 0.2s;font-family:var(--font-ui);white-space:nowrap;}
        .effect-btn:hover{color:var(--text-main);background:rgba(255,255,255,0.04);}
        .effect-btn.active{color:var(--accent-primary);background:rgba(212,175,55,0.12);border-color:var(--accent-primary);}

        .drop-zone{padding:14px;text-align:center;cursor:pointer;border:1px dashed var(--glass-border);border-radius:8px;transition:all 0.3s;margin-bottom:6px;}
        .drop-zone:hover{background:rgba(255,255,255,0.02);border-color:var(--accent-primary);}
        .drop-zone:hover .drop-icon{color:var(--accent-primary);transform:scale(1.1);}
        .drop-icon{display:block;font-size:1.2rem;color:var(--text-muted);margin-bottom:4px;transition:transform 0.3s;}
        .drop-text{font-family:var(--font-serif);font-size:0.85rem;color:var(--text-main);}
        .drop-sub{font-size:0.55rem;color:var(--text-muted);margin-top:2px;}

        .mode-row{display:flex;gap:6px;margin-bottom:6px;}
        .mode-btn{flex:1;padding:8px;border:1px solid var(--glass-border);border-radius:6px;background:rgba(255,255,255,0.03);color:var(--text-muted);cursor:pointer;font-family:var(--font-ui);font-size:0.65rem;letter-spacing:1px;transition:all 0.25s;text-align:center;}
        .mode-btn:hover{border-color:var(--accent-primary);color:var(--text-main);}
        .mode-btn.active{background:var(--accent-primary);color:#000;border-color:var(--accent-primary);box-shadow:0 0 8px var(--accent-glow);}
        .mode-btn .mode-icon{display:block;font-size:1rem;margin-bottom:2px;}

        .model-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
        .model-item{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:5px 8px;}
        .model-item .name{flex:1;font-size:0.65rem;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .model-item .pts{font-size:0.55rem;color:var(--text-muted);margin-right:2px;}
        .model-item .badge{font-size:0.5rem;padding:1px 5px;border-radius:4px;margin-right:4px;}
        .badge-done{background:rgba(212,175,55,0.15);color:var(--accent-primary);}
        .badge-buf{background:rgba(100,200,255,0.15);color:#64c8ff;}
        .model-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:0.65rem;transition:all 0.2s;line-height:1;}
        .model-btn:hover{color:var(--accent-primary);background:rgba(212,175,55,0.1);}
        .model-btn.del:hover{color:#e74c3c;background:rgba(231,76,60,0.1);}

        .music-section{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:4px;border:1px solid var(--glass-border);border-radius:8px;background:rgba(255,255,255,0.02);}
        .music-section .label{font-size:0.55rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
        .music-section .fname{flex:1;font-size:0.6rem;color:var(--text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .music-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:0.85rem;transition:all 0.2s;line-height:1;}
        .music-btn:hover{color:var(--accent-primary);background:rgba(212,175,55,0.1);}
        .music-btn.playing{color:var(--accent-primary);}
        .music-vol{width:50px;height:2px;-webkit-appearance:none;background:var(--glass-border);border-radius:2px;outline:none;cursor:pointer;}
        .music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--accent-primary);border:none;}
        .music-btn.rhythm-on{color:var(--accent-primary);background:rgba(212,175,55,0.15);}
        .rhythm-row{display:none;align-items:center;gap:6px;padding:2px 10px 6px;}
        .rhythm-row.active{display:flex;}
        .rhythm-row .rlabel{font-size:0.5rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
        .rhythm-row .rval{font-size:0.5rem;color:var(--text-muted);min-width:18px;text-align:right;}
        .rhythm-slider{flex:1;height:2px;-webkit-appearance:none;background:var(--glass-border);border-radius:2px;outline:none;cursor:pointer;}
        .rhythm-slider::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--accent-primary);border:none;}

        .assemble-hint{text-align:center;font-size:0.6rem;color:var(--accent-primary);padding:4px;border-radius:4px;background:rgba(212,175,55,0.08);margin-top:4px;animation:blink 1.5s infinite;}
        .assemble-progress{height:2px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden;}
        .assemble-progress .bar{height:100%;width:0%;background:var(--accent-primary);transition:width 0.1s linear;}
        @keyframes blink{0%,100%{opacity:0.6}50%{opacity:1}}

        .help-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;}
        .help-item{display:flex;align-items:center;gap:8px;font-size:0.7rem;color:var(--text-muted);}
        .help-item .kbd{color:var(--accent-primary);font-family:var(--font-serif);font-style:italic;font-weight:600;font-size:0.75rem;}

        #float-hints{position:absolute;bottom:24px;left:24px;z-index:5;display:flex;flex-direction:column;gap:3px;transition:opacity 0.4s;}
        .hint-pill{font-size:0.55rem;color:rgba(255,255,255,0.3);font-family:var(--font-ui);letter-spacing:0.5px;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);padding:3px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);white-space:nowrap;}
        .hint-pill .key{color:var(--accent-primary);font-family:var(--font-serif);font-style:italic;font-weight:600;}

        #editor-sidebar{position:fixed;top:0;right:-380px;width:360px;height:100vh;z-index:50;background:var(--glass-surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--glass-border);transition:right 0.35s ease;display:flex;flex-direction:column;overflow:hidden;}
        #editor-sidebar.open{right:0;}
        #editor-sidebar .editor-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--glass-border);font-family:var(--font-ui);font-size:0.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent-primary);}
        #editor-sidebar .editor-header button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;padding:4px;}
        #editor-sidebar .editor-header button:hover{color:var(--text-main);}
        #editor-models{flex:1;overflow-y:auto;padding:8px;}
        .editor-model{border:1px solid var(--glass-border);border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,0.02);overflow:hidden;}
        .editor-model-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;font-size:0.6rem;color:var(--text-main);letter-spacing:0.5px;transition:background 0.2s;}
        .editor-model-header:hover{background:rgba(255,255,255,0.03);}
        .editor-model-header .arrow{font-size:0.5rem;color:var(--text-muted);transition:transform 0.2s;}
        .editor-model-header .arrow.open{transform:rotate(90deg);}
        .editor-model-body{display:none;padding:8px 12px 12px;border-top:1px solid rgba(255,255,255,0.04);}
        .editor-model-body.open{display:block;}
        .editor-model-body .ctrl-group{margin-bottom:4px;}
        .editor-model-body .ctrl-group label{font-size:0.5rem;}
        .editor-model-body .ctrl-group input{width:100%;}
        .editor-pts{font-size:0.5rem;color:var(--text-muted);margin-left:auto;margin-right:8px;white-space:nowrap;}
        .editor-empty{padding:20px;text-align:center;color:var(--text-muted);font-size:0.6rem;letter-spacing:0.5px;}
        .style-row{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--glass-border);}
        .style-btn{flex:1;padding:3px 2px;border:1px solid var(--glass-border);border-radius:4px;background:transparent;color:var(--text-muted);font-size:0.45rem;cursor:pointer;font-family:var(--font-ui);text-align:center;transition:all 0.2s;}
        .style-btn:hover{border-color:var(--accent-primary);color:var(--text-main);}
        .style-btn.active{background:var(--accent-primary);color:#121212;border-color:var(--accent-primary);}

        .editor-model-header .vis-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.7rem;padding:2px 4px;line-height:1;}
        .editor-model-header .vis-btn:hover{color:var(--accent-primary);}
        .editor-model-header .vis-btn.off{opacity:0.3;}
        .editor-model-header .name-edit{background:none;border:none;color:var(--text-main);font-family:var(--font-ui);font-size:0.6rem;padding:2px 4px;flex:1;min-width:0;outline:none;cursor:text;}
        .editor-model-header .name-edit:focus{border-bottom:1px solid var(--accent-primary);}
        .editor-model-body .coord-row{display:flex;gap:6px;margin-bottom:4px;}
        .editor-model-body .coord-row .ctrl-group{flex:1;}
        .editor-model-body .coord-row .ctrl-group label{font-size:0.45rem;text-transform:uppercase;}
        .editor-model-body .coord-row .ctrl-group input[type="range"]{height:3px;}
        .editor-model-body .color-row{display:flex;gap:6px;margin-bottom:6px;}
        .editor-model-body .color-row input[type="color"]{flex:1;height:22px;border:1px solid var(--glass-border);border-radius:4px;background:transparent;cursor:pointer;padding:0;}
        .editor-model-body .effect-mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
        .editor-model-body .effect-mini button{font-size:0.45rem;padding:2px 8px;border:1px solid var(--glass-border);background:transparent;color:var(--text-muted);border-radius:4px;cursor:pointer;}
        .editor-model-body .effect-mini button.active{background:var(--accent-primary);color:#121212;border-color:var(--accent-primary);}

        @keyframes spin{100%{transform:rotate(360deg)}}
    </style>
    <script type="importmap">{ "imports":{ "three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" }}</script>
</head>
<body>


    <div id="float-hints" class="ui-element">
        <div class="hint-pill"><span class="key">WASD</span> 移动</div>
        <div class="hint-pill"><span class="key">Q / E</span> 升降</div>
        <div class="hint-pill"><span class="key">Shift</span> 加速</div>
        <div class="hint-pill"><span class="key">鼠标</span> 视角</div>
        <div class="hint-pill"><span class="key">H</span> 隐藏鼠标</div>
        <div class="hint-pill"><span class="key">Z</span> 隐藏UI</div>
        <div class="hint-pill"><span class="key">P</span> 编辑器</div>
        <div class="hint-pill"><span class="key">空格</span> 组装缓冲场景</div>
    </div>
    <div id="bottom-bar" class="ui-element">
        <button class="tab-btn active" data-tab="controls">⚙ 控制</button>
        <button class="tab-btn" data-tab="import">✦ 导入</button>

    </div>
    <div id="panel-content" class="visible ui-element">
        <div class="panel-inner active" id="panel-controls">
            <div class="ctrl-row">
                <div class="ctrl-group"><label data-key="ctrl_scale">Scale</label><input type="range" min="0.1" max="3.0" step="0.1" value="2.5" id="input-scale"></div>
                <div class="ctrl-group"><label data-key="ctrl_opacity">Opacity</label><input type="range" min="0.1" max="2.0" step="0.1" value="1.0" id="input-opacity"></div>
                <div class="ctrl-group"><label data-key="ctrl_exposure">Exposure</label><input type="range" min="0.5" max="3.0" step="0.1" value="1.0" id="input-brightness"></div>
                <div class="ctrl-group"><label data-key="ctrl_speed">Speed</label><input type="range" min="1" max="100" step="1" value="10" id="input-speed"></div>
            </div>
            <div class="ctrl-row" style="margin-bottom:0">
                <div style="flex:1"></div>
                <div class="ctrl-actions">
                    <button class="ctrl-btn" onclick="toggleTurbulence()" id="btn-flow" title="Dispersion Flow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c.6 0 1.2.4 1.6.9.6.7 1.4 1.1 2.4 1.1 1.9 0 2.4-1.9 4.4-1.9 1 0 1.8.4 2.4 1.1.4.5 1 .9 1.6.9"/><path d="M2 8c.6 0 1.2.4 1.6.9.6.7 1.4 1.1 2.4 1.1 1.9 0 2.4-1.9 4.4-1.9 1 0 1.8.4 2.4 1.1.4.5 1 .9 1.6.9"/><path d="M2 16c.6 0 1.2.4 1.6.9.6.7 1.4 1.1 2.4 1.1 1.9 0 2.4-1.9 4.4-1.9 1 0 1.8.4 2.4 1.1.4.5 1 .9 1.6.9"/><path d="M16 12c.5-.5 1.1-.9 1.6-.9.6 0 1.2.4 1.6.9.6.7 1.4 1.1 2.4 1.1.2 0 .4 0 .6-.1"/></svg>
                    </button>
                    <button class="effect-btn" onclick="toggleWave()" id="btn-wave">🌊 海浪</button>
                    <button class="effect-btn" onclick="toggleRhythmSway()" id="btn-rhythm-sway">🎵 律动</button>
                    <button class="effect-btn" onclick="toggleHeartbeat()" id="btn-heartbeat">💓 心跳</button>
                    <button class="effect-btn" onclick="toggleRotation()" id="btn-rotation">🌀 旋转</button>
                    <button class="effect-btn" onclick="toggleDemoMode()" id="btn-demo">🔄 演示</button>
                    <button class="ctrl-btn" onclick="downloadModel()" id="btn-download" title="Download Model">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button class="ctrl-btn" onclick="autoFocusCamera()" title="Reset View">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>
            <div id="flow-sub">
                <div class="ctrl-row" style="margin-bottom:0">
                    <div class="ctrl-group"><label data-key="flow_amp">Amp</label><input type="range" min="0.5" max="10.0" step="0.5" value="4.0" id="input-flow-amp"></div>
                    <div class="ctrl-group"><label data-key="flow_freq">Freq</label><input type="range" min="0.1" max="1.0" step="0.1" value="0.3" id="input-flow-freq"></div>
                    <div class="ctrl-group"><label data-key="flow_speed">Speed</label><input type="range" min="0.1" max="2.0" step="0.1" value="0.6" id="input-flow-speed"></div>
                </div>
            </div>
            <div id="wave-sub" class="effect-sub">
                <div class="ctrl-row">
                    <div class="ctrl-group"><label>Amp</label><input type="range" min="0.5" max="5.0" step="0.5" value="1.5" id="input-wave-amp"></div>
                    <div class="ctrl-group"><label>Freq</label><input type="range" min="0.1" max="1.0" step="0.1" value="0.3" id="input-wave-freq"></div>
                    <div class="ctrl-group"><label>Speed</label><input type="range" min="0.1" max="2.0" step="0.1" value="0.5" id="input-wave-speed"></div>
                </div>
            </div>
            <div id="rhythm-sub" class="effect-sub">
                <div class="ctrl-row">
                    <div class="ctrl-group"><label>灵敏度</label><input type="range" min="0.1" max="3.0" step="0.1" value="1.0" id="input-rhythm-sway"></div>
                    <div class="ctrl-group"><label>鼓点阈值</label><input type="range" min="1.1" max="2.5" step="0.05" value="1.4" id="input-drum-thresh"></div>
                </div>
            </div>
            <div id="heartbeat-sub" class="effect-sub">
                <div class="ctrl-row">
                    <div class="ctrl-group"><label>频率</label><input type="range" min="0.3" max="3.0" step="0.3" value="1.5" id="input-hb-rate"></div>
                    <div class="ctrl-group"><label>幅度</label><input type="range" min="0.05" max="0.5" step="0.05" value="0.2" id="input-hb-amp"></div>
                </div>
            </div>
            <div id="rotation-sub" class="effect-sub">
                <div class="ctrl-row">
                    <div class="ctrl-group"><label>速度</label><input type="range" min="0.1" max="3.0" step="0.1" value="0.5" id="input-rot-speed"></div>
                </div>
            </div>
        </div>
        <div class="panel-inner" id="panel-import">
            <div id="assemble-status"></div>
            <div id="mode-selector" class="mode-row">
                <button class="mode-btn active" data-mode="direct"><span class="mode-icon">✦</span>直接生成</button>
                <button class="mode-btn" data-mode="buffer"><span class="mode-icon">◎</span>缓冲模式</button>
            </div>
            <div id="model-list" class="model-list"></div>
            <div class="drop-zone" id="drop-area">
                <span class="drop-icon">✦</span>

    <script type="module">

        const dictionary={en:{ctrl_scale:"Scale",ctrl_opacity:"Opacity",ctrl_exposure:"Exposure",ctrl_speed:"Speed",flow_amp:"Amp",flow_freq:"Freq",flow_speed:"Flow Spd",import_main:"Click or drag .PLY",import_sub:"Direct / Buffer mode",btn_flow_tooltip:"Disperse / Reset Flow",btn_download_tooltip:"Download Model (.ply)"},zh:{ctrl_scale:"缩放",ctrl_opacity:"透明度",ctrl_exposure:"曝光",ctrl_speed:"速度",flow_amp:"强度",flow_freq:"频率",flow_speed:"流速",import_main:"点击或拖拽上传 .PLY",import_sub:"支持直接生成 / 缓冲模式",btn_flow_tooltip:"散开 / 复原 (湍流效果)",btn_download_tooltip:"下载模型 (.ply)"}};

        // Mode selector

        function initModeSelector(){
            const btns=document.querySelectorAll('.mode-btn');

                btns.forEach(x=>x.classList.remove('active'));b.classList.add('active');
                currentMode=b.dataset.mode;
            }));
        }



        // --- Globals ---
        let scene,camera,renderer;
        const models=[]; // {id,name,geometryData,rawPlyData,mesh,bufferMode,assembled}
        let modelCounter=0;
        const MODEL_SPACING=8;
        const ASSEMBLE_DURATION=2; // seconds
        const FADE_DURATION=1.0; // cross-fade seconds

        const demo={active:false,index:0,prevMesh:null,
            state:'idle', // idle|assembling|assembled|disassembling
            disassembleStyle:'sphere', // sphere|explode|swirl|fade
        };

        const clock=new THREE.Clock();
        const SH_C0=0.28209479177387814;
        const _vMoveDir=new THREE.Vector3(),_vForward=new THREE.Vector3(),_vRight=new THREE.Vector3(),_vUp=new THREE.Vector3(0,1,0);
        const physics={velocity:new THREE.Vector3(),inputVector:new THREE.Vector3(),move:{f:0,b:0,l:0,r:0,u:0,d:0},boost:false,mouseDown:false,mouseLast:{x:0,y:0},targetRot:new THREE.Euler(0,0,0,'YXZ'),currRot:new THREE.Euler(0,0,0,'YXZ')};
        const state={mode:'Fly',splatScale:2.5,opacity:1.0,brightness:1.0,flySpeed:10.0,acceleration:100.0,friction:10.0,minOpacity:0.05,turbulence:0.0,flowAmp:4.0,flowFreq:0.3,flowSpeed:0.6,
            effectWave:0,waveAmp:1.5,waveFreq:0.3,waveSpeed:0.5,effectRhythm:0,rhythmSway:1.0,effectHeartbeat:0,hbRate:1.5,hbAmp:0.2,
            rotationEffect:0,rotSpeed:0.5};
        const _vCamPos=new THREE.Vector3();
        let currentTurbulence=0.0;
        let currentPulse=0,rhythmEnabled=false,rhythmSensitivity=1;
        let drumHit=0,drumAvg=0,drumThreshold=1.4;
        let audioPlayer=null,audioCtx=null,analyser=null;

        // --- Multi-Model ---
        function addModel(gd,raw,name,bufferMode){
            const id=modelCounter++;
            const model={id,name,geometryData:gd,rawPlyData:raw,mesh:null,bufferMode:!!bufferMode,assembled:!bufferMode,
                visible:true,opacity:1.0,colorTint:[1,1,1],posOffset:[0,0,0],
                effectWave:0,effectRhythm:0,effectHeartbeat:0,rotationEffect:0,
                translateMode:false,
                assembleProgress:bufferMode?0:1,isAssembling:false,disassembling:false,_fadeOpacity:1,_enterProgress:1,
                _translating:false,_translateProgress:0};
            if(models.length===0)model.yOffset=0;
            else{const minY=Math.min(...models.map(m=>m.yOffset));model.yOffset=minY-MODEL_SPACING;}
            models.push(model);
            rebuildScene();
            updateModelListUI();
            updateAssembleStatus();
            return model;
        }
        function removeModel(id){
            const idx=models.findIndex(m=>m.id===id);
            if(idx<0)return;
            models.splice(idx,1);
            if(models.length===0){
                if(scene){
                    while(scene.children.length){const c=scene.children[0];if(c.type==='Group'){c.children.forEach(ch=>{if(ch.geometry)ch.geometry.dispose();if(ch.material)ch.material.dispose();})}scene.remove(c);}
                    const grid=new THREE.GridHelper(100,100,0x333333,0x1a1a1a);grid.position.y=-5;grid.material.opacity=0.3;grid.material.transparent=true;scene.add(grid);
                }
    
                updateModelListUI();updateAssembleStatus();
                return;
            }
            rebuildScene();updateModelListUI();updateAssembleStatus();
        }
        function moveModelUp(id){const idx=models.findIndex(m=>m.id===id);if(idx<=0)return;[models[idx],models[idx-1]]=[models[idx-1],models[idx]];recalcYOffsets();rebuildScene();updateModelListUI();}
        function moveModelDown(id){const idx=models.findIndex(m=>m.id===id);if(idx<0||idx>=models.length-1)return;[models[idx],models[idx+1]]=[models[idx+1],models[idx]];recalcYOffsets();rebuildScene();updateModelListUI();}
        function recalcYOffsets(){models.forEach((m,i)=>{m.yOffset=-i*MODEL_SPACING;});}

        function startAssemble(){
            if(demo.active){
                const m=models[demo.index];
                if(!m)return;
                if(demo.state==='idle'){
                    demo.state='assembling';
                    m.isAssembling=true;
                    m._enterProgress=1;
                    if(m.translateMode){
                        m.posOffset[2]=0;
                        if(m.mesh)m.mesh.material.uniforms.uPosOffset.value.fromArray(m.posOffset);
                    }
                }
                else if(demo.state==='assembled'){
                    const nextIdx=(demo.index+1)%models.length;
                    const nextM=models[nextIdx];
                    if(m.translateMode){
                        // Translate first (no next model yet), then disassemble
                        demo.state='disassembling';
                        m._translating=true;
                        m._translateProgress=0;
                    }else{
                        demo.state='disassembling';
                        m.disassembling=true;
                        // Normal: pre-build next model for fade-in
                        if(nextM&&nextM!==m){
                            nextM.assembleProgress=0;
                            nextM.assembled=false;
                            nextM._enterProgress=0;
                            const nmMesh=createSplatMesh(nextM.geometryData,0,true);
                            const nmGroup=new THREE.Group();nmGroup.add(nmMesh);scene.add(nmGroup);
                            nextM.mesh=nmMesh;
                            nextM.visible=true;
                            nmMesh.material.uniforms.uOpacityMod.value=0;
                        }
                    }
                }
                return;
            }
            // Normal mode: all buffer models
            const bufferModels=models.filter(m=>m.bufferMode);
            if(!bufferModels.length)return;
            const anyActive=bufferModels.some(m=>!m.assembled||m.isAssembling||m.disassembling);
            if(anyActive){
                bufferModels.forEach(m=>{if(!m.assembled&&!m.isAssembling&&!m.disassembling)m.isAssembling=true;});
            }else{
                bufferModels.forEach(m=>{m.disassembling=true;m.assembled=false;});
            }
        }

        function updateAssembleStatus(){
            const el=document.getElementById('assemble-status');
            if(demo.active){
                const m=models[demo.index];
                if(!m){el.innerHTML='';return;}
                const labels={idle:'缓冲态·按空格组装',assembling:'组装中…',assembled:'已组装·按空格拆解',disassembling:'拆解中…'};
                el.innerHTML=`<div class="assemble-hint">📽 demo ${demo.index+1}/${models.length}「${m.name||'模型'+(demo.index+1)}」${labels[demo.state]||''}</div>`;
                return;
            }
            const hasBuffer=models.some(m=>m.bufferMode);
            if(hasBuffer){
                const allAssembled=models.every(m=>!m.bufferMode||m.assembled);
                const anyAnim=models.some(m=>m.isAssembling||m.disassembling);
                let hint='⏎ 空格拆回缓冲形态';
                if(!allAssembled&&!anyAnim)hint='⏎ 空格键组装 · 走近自动组装';
                else if(anyAnim)hint='⏎ 动画中…';
                const progress=anyAnim?50:allAssembled?100:0;
                el.innerHTML=`<div class="assemble-hint">${hint}</div><div class="assemble-progress"><div class="bar" style="width:${progress}%"></div></div>`;
            }else el.innerHTML='';
        }

        function rebuildScene(){
            if(!scene)return;
            // Remove old model meshes
            const toRemove=[];
            scene.children.forEach(c=>{if(c.type==='Group')toRemove.push(c);});
            toRemove.forEach(c=>{c.children.forEach(ch=>{if(ch.geometry)ch.geometry.dispose();if(ch.material)ch.material.dispose();});scene.remove(c);});
            // Reset all mesh references
            models.forEach(m=>{m.mesh=null;});
            if(demo.active){
                // Demo mode: build only current index at origin
                const idx=demo.index;
                models.forEach((m,i)=>{
                    if(i===idx&&idx>=0&&idx<models.length){
                        const mesh=createSplatMesh(m.geometryData,0,m.bufferMode&&!m.assembled);
                        const group=new THREE.Group();group.add(mesh);scene.add(group);
                        m.mesh=mesh;
                        m.visible=true;
                        m._enterProgress=1;
                    }else{
                        m.mesh=null;
                    }
                });
            }else{
                // Normal: build all
                models.forEach(m=>{
                    const mesh=createSplatMesh(m.geometryData,m.yOffset||0,m.bufferMode&&!m.assembled);
                    const group=new THREE.Group();group.add(mesh);scene.add(group);
                    m.mesh=mesh;
                });
            }
            updateUniforms();
            let total=0;models.forEach(m=>total+=m.geometryData.count);

        }

        window.__removeModel=removeModel;window.__moveUp=moveModelUp;window.__moveDown=moveModelDown;

        function updateModelListUI(){
            const container=document.getElementById('model-list');
            if(models.length===0){container.innerHTML='';return;}
            let html='';
            models.forEach((m,i)=>{
                const name=m.name||'Model '+(i+1);
                const pts=(m.geometryData.count/1000000).toFixed(2)+'M';
                const badge=m.bufferMode&&!m.assembled?'<span class="badge badge-buf">缓冲</span>':'<span class="badge badge-done">已生成</span>';
                const demoTag=demo.active&&i===demo.index?'<span class="badge badge-done" style="background:rgba(255,100,100,0.2);color:#ff6464">▶演示中</span>':'';
                html+=`<div class="model-item"><span class="name" title="${name}">${name}</span>${badge}${demoTag}<span class="pts">${pts}</span><button class="model-btn" onclick="window.__moveUp(${m.id})" title="上移">↑</button><button class="model-btn" onclick="window.__moveDown(${m.id})" title="下移">↓</button><button class="model-btn del" onclick="window.__removeModel(${m.id})" title="移除">×</button></div>`;
            });
            container.innerHTML=html;
            if(document.getElementById('editor-sidebar').classList.contains('open'))updateEditorModels();
        }

        // --- Init ---
        init();animate();

        function init(){
            applyLanguage();initTabs();initModeSelector();
            const container=document.getElementById('canvas-container');
            scene=new THREE.Scene();scene.background=new THREE.Color(0x121212);scene.fog=new THREE.FogExp2(0x121212,0.02);
            const grid=new THREE.GridHelper(100,100,0x333333,0x1a1a1a);grid.position.y=-5;grid.material.opacity=0.3;grid.material.transparent=true;scene.add(grid);
            camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,5000);camera.position.set(0.1,0.1,0.1);
            physics.targetRot.setFromQuaternion(camera.quaternion,'YXZ');physics.currRot.copy(physics.targetRot);
            renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance",stencil:false,depth:true});
            renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.0));
            renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;container.appendChild(renderer.domElement);
            bindUI();setupDragAndDrop();setupKeyboard();
            window.addEventListener('resize',onWindowResize);window.addEventListener('contextmenu',e=>e.preventDefault());
            const params=new URLSearchParams(window.location.search);
            const modelUrl=params.get('url');
            if(modelUrl)loadFileFromUrl(modelUrl);
            // Auto-load built-in PLY files for demo
            loadBuiltinPLYFiles();
        }
        async function loadBuiltinPLYFiles(){
            const files=['001.ply','002.ply','003.ply','004.ply','005.ply','006.ply','007.ply','008.ply','009.ply','010.ply','011.ply'];
            for(const name of files){
                try{

        }



        // --- createSplatMesh with assemble shader ---
        function createSplatMesh(data,yOffset,isBuffer){
            const base=new THREE.PlaneGeometry(1,1);
            const geo=new THREE.InstancedBufferGeometry();
            geo.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,0,0),50);geo.frustumCulled=false;
            geo.index=base.index;geo.attributes.position=base.attributes.position;geo.attributes.uv=base.attributes.uv;
            const offsetPos=new Float32Array(data.pos.length);
            for(let i=0;i<data.pos.length;i+=3){offsetPos[i]=data.pos[i];offsetPos[i+1]=data.pos[i+1]+(yOffset||0);offsetPos[i+2]=data.pos[i+2];}
            geo.setAttribute('instPosition',new THREE.InstancedBufferAttribute(offsetPos,3));
            geo.setAttribute('instRotation',new THREE.InstancedBufferAttribute(data.rot,4));
            geo.setAttribute('instScale',new THREE.InstancedBufferAttribute(data.scale,3));
            geo.setAttribute('instColor',new THREE.InstancedBufferAttribute(data.col,4));
            // Compute model radius from center
            let maxDist=0;
            for(let i=0;i<Math.min(offsetPos.length,3000);i+=3){
                const dx=offsetPos[i]-(data.center?.x||0),dy=offsetPos[i+1]-(data.center?.y||0),dz=offsetPos[i+2]-(data.center?.z||0);
                const d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d>maxDist)maxDist=d;
            }
            const modelRadius=Math.max(maxDist,1);

            const mat=new THREE.ShaderMaterial({
                uniforms:{
                    uSplatScale:{value:state.splatScale},uOpacityMod:{value:state.opacity},uBrightness:{value:state.brightness},
                    uTime:{value:0},uTurbulence:{value:0},uFlowAmp:{value:state.flowAmp},uFlowFreq:{value:state.flowFreq},uFlowSpeed:{value:state.flowSpeed},
                    uModelCenter:{value:data.center||new THREE.Vector3()},
                    uAssembleProgress:{value:isBuffer?0:1},
                    uModelRadius:{value:modelRadius},
                    uPulse:{value:0},
                    uEffectWave:{value:0},uWaveAmp:{value:state.waveAmp},uWaveFreq:{value:state.waveFreq},uWaveSpeed:{value:state.waveSpeed},
                    uEffectRhythm:{value:0},uRhythmHeight:{value:0},
                    uEffectHeartbeat:{value:0},uHbRate:{value:state.hbRate},uHbAmp:{value:state.hbAmp},
                    uColorTint:{value:new THREE.Vector3(1,1,1)},uPosOffset:{value:new THREE.Vector3(0,0,0)},
                    uRotationEffect:{value:0},uRotSpeed:{value:0.5},
                    uMoveEffect:{value:0},
                    uDisassembleStyle:{value:0}
                },
                vertexShader:`
                    uniform float uSplatScale;uniform float uTime;uniform float uTurbulence;uniform float uFlowAmp;uniform float uFlowFreq;uniform float uFlowSpeed;uniform float uPulse;
                    uniform vec3 uModelCenter;uniform float uAssembleProgress;uniform float uModelRadius;
                    uniform float uEffectWave;uniform float uWaveAmp;uniform float uWaveFreq;uniform float uWaveSpeed;
                    uniform float uEffectRhythm;uniform float uRhythmHeight;
                    uniform float uEffectHeartbeat;uniform float uHbRate;uniform float uHbAmp;
                    uniform vec3 uColorTint;uniform vec3 uPosOffset;
                    uniform float uRotationEffect;uniform float uRotSpeed;
                    uniform float uMoveEffect;
                    uniform float uDisassembleStyle;

                    attribute vec3 instPosition;attribute vec4 instRotation;attribute vec3 instScale;attribute vec4 instColor;
                    varying vec4 vColor;varying vec2 vUv;

                    // Pseudo-random from position
                    float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}

                    mat3 getRotationMatrix(vec4 q){
                        float x=q.x,y=q.y,z=q.z,w=q.w;float x2=x+x,y2=y+y,z2=z+z;
                        float xx=x*x2,xy=x*y2,xz=x*z2,yy=y*y2,yz=y*z2,zz=z*z2;
                        float wx=w*x2,wy=w*y2,wz=w*z2;
                        return mat3(1.0-(yy+zz),xy-wz,xz+wy,xy+wz,1.0-(xx+zz),yz-wx,xz-wy,yz+wx,1.0-(xx+yy));
                    }

                    vec3 curl(vec3 p,float t,float freq){
                        vec3 pm=p*freq+vec3(t*0.5,t*0.3,t*0.2);
                        float x=sin(pm.y)+cos(pm.z),y=sin(pm.z)+cos(pm.x),z=sin(pm.x)+cos(pm.y);
                        vec3 pm2=p*freq*2.0-vec3(t,t,t);
                        x+=(sin(pm2.y)+cos(pm2.z))*0.5;y+=(sin(pm2.z)+cos(pm2.x))*0.5;z+=(sin(pm2.x)+cos(pm2.y))*0.5;
                        return vec3(x,y,z);
                    }

                    void main(){
                        vUv=uv;vColor=instColor;
                        vec3 targetPos=instPosition;
                        vec3 pos=position*instScale*uSplatScale*(1.0+uPulse*0.4);
                        pos=getRotationMatrix(instRotation)*pos;

                        vec3 centerPos=targetPos;

                        // Buffer mode: sphere → assemble transition (GPU-side)
                        if(uAssembleProgress<0.999){
                            vec3 rel=targetPos-uModelCenter;
                            float dist=length(rel);
                            float h=hash(targetPos+vec3(1.0,3.0,5.0));
                            float h2=hash(targetPos+vec3(7.0,11.0,13.0));
                            float theta=h*6.2832;
                            float phi=acos(2.0*h2-1.0);
                            vec3 randDir=vec3(sin(phi)*cos(theta),cos(phi),sin(phi)*sin(theta));
                            float prog=uAssembleProgress;
                            prog=prog*prog*(3.0-2.0*prog); // smooth ease

                            vec3 startPos;
                            if(uDisassembleStyle<0.5){
                                // sphere: random points within sphere
                                float r=pow(h,0.333)*dist;
                                startPos=uModelCenter+randDir*r;
                                float wanderAmp=dist*0.15;
                                startPos+=sin(uTime*0.4+targetPos*2.0)*wanderAmp;
                            }else if(uDisassembleStyle<1.5){
                                // explode: radial outward
                                float r=dist*(1.0+pow(h,0.5)*2.0);
                                startPos=uModelCenter+normalize(rel)*r;
                            }else if(uDisassembleStyle<2.5){
                                // swirl: spiral outward
                                float swirlAng=theta+dist*0.5;
                                float r=dist*(1.0+pow(h,0.333)*1.5);
                                vec3 sRel=vec3(sin(swirlAng)*r*0.5,cos(phi)*dist*0.5,cos(swirlAng)*r*0.5);
                                startPos=uModelCenter+sRel;
                            }else{
                                // fade: stay in place (opacity handled in fragment)
                                startPos=targetPos;
                            }

                            centerPos=mix(startPos,targetPos,prog);

                            // Fade style: modulate alpha
                            if(uDisassembleStyle>2.5){
                                vColor.a*=0.3+0.7*prog;
                            }
                        }

                        if(uTurbulence>0.001){
                            vec3 swimDir=curl(centerPos,uTime*uFlowSpeed,uFlowFreq);
                            centerPos+=swimDir*uTurbulence*uFlowAmp;
                        }

                        if(uEffectWave>0.5){
                            float wave=sin(centerPos.x*uWaveFreq+uTime*uWaveSpeed)*uWaveAmp;
                            centerPos.y+=wave;
                        }
                        if(uEffectRhythm>0.5){
                            centerPos.y+=uRhythmHeight;
                        }
                        if(uEffectHeartbeat>0.5){
                            float beat=abs(sin(uTime*uHbRate));
                            float expansion=1.0+beat*uHbAmp;
                            vec3 rel=centerPos-uModelCenter;
                            centerPos=uModelCenter+rel*expansion;
                        }

                        if(uRotationEffect>0.5){
                            float spd=(hash(instPosition*13.37+3.14)*0.8+0.2)*uRotSpeed;
                            float ang=uTime*spd;
                            float ca=cos(ang),sa=sin(ang);
                            vec3 rel=centerPos-uModelCenter;
                            centerPos.x=uModelCenter.x+rel.x*ca-rel.y*sa;
                            centerPos.y=uModelCenter.y+rel.x*sa+rel.y*ca;
                            // 颜色拖尾：根据旋转角度偏移颜色
                            float trail=abs(sin(ang*2.0+hash(instPosition*7.77)*6.2832))*0.3;
                            vColor.rgb=mix(vColor.rgb,vColor.rgb*vec3(1.3,0.8,1.5),trail);
                        }

                        // 移动消散：沿 Z 轴移动后再散开

                    }
                `,
                fragmentShader:`uniform float uOpacityMod;uniform float uBrightness;uniform float uPulse;uniform vec3 uColorTint;varying vec4 vColor;varying vec2 vUv;void main(){vec2 c=vUv*2.0-1.0;if(dot(c,c)>1.0)discard;float a=exp(-dot(c,c)*2.0)*vColor.a*uOpacityMod;if(a<0.05)discard;gl_FragColor=vec4(vColor.rgb*uBrightness*(1.0+uPulse*0.3)*uColorTint,a);}`,
                side:THREE.DoubleSide,depthWrite:true,depthTest:true

        function updatePhysics(dt){
            const rl=10*dt;physics.currRot.x+=(physics.targetRot.x-physics.currRot.x)*Math.min(1,rl);physics.currRot.y+=(physics.targetRot.y-physics.currRot.y)*Math.min(1,rl);camera.quaternion.setFromEuler(physics.currRot);
            const ip=physics.inputVector;ip.set(0,0,0);ip.z=physics.move.b-physics.move.f;ip.x=physics.move.r-physics.move.l;ip.y=physics.move.u-physics.move.d;if(ip.lengthSq()>0)ip.normalize();
            _vMoveDir.set(0,0,0);_vForward.set(0,0,-1).applyQuaternion(camera.quaternion);_vRight.set(1,0,0).applyQuaternion(camera.quaternion);
            if(ip.z!==0)_vMoveDir.addScaledVector(_vForward,-ip.z);if(ip.x!==0)_vMoveDir.addScaledVector(_vRight,ip.x);if(ip.y!==0)_vMoveDir.addScaledVector(_vUp,ip.y);if(_vMoveDir.lengthSq()>0)_vMoveDir.normalize();
            const ms=state.flySpeed*(physics.boost?4:1);if(_vMoveDir.lengthSq()>0)physics.velocity.addScaledVector(_vMoveDir,state.acceleration*dt);const dmp=Math.exp(-state.friction*dt);physics.velocity.multiplyScalar(dmp);if(physics.velocity.length()>ms)physics.velocity.setLength(ms);camera.position.addScaledVector(physics.velocity,dt);

        async function loadPlyFiles(files){
            const total=files.length;
            for(let i=0;i<total;i++){
                const file=files[i];
                if(!file.name.match(/\.ply$/i))continue;
                try{
                    const buffer=await file.arrayBuffer();
                    const gd=parsePLY(buffer);
                    if(gd)addModel(gd,buffer,file.name.replace(/\.ply$/i,''),currentMode==='buffer');
                }catch(err){console.error("PLY load failed:",file.name,err);}
            }
        }

        function loadFileFromUrl(url){
            const xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.responseType='arraybuffer';
            xhr.onload=()=>{
                if(xhr.status===200){
                    const name=url.split('/').pop().replace(/\.ply$/i,'')||'download';
                    const gd=parsePLY(xhr.response);
                    if(gd)addModel(gd,xhr.response,name,false);
                }else{alert("Download Failed: HTTP "+xhr.status);}
            };
            xhr.onerror=()=>{alert("Download Failed: Network Error");};xhr.send();
        }

        function parsePLY(buffer){
            const dec=new TextDecoder();const headBytes=new Uint8Array(buffer,0,4000);
            const headStr=dec.decode(headBytes);const endIdx=headStr.indexOf("end_header");
            if(endIdx<0)throw new Error("Header not found");
            let bodyStart=endIdx+10;if(headBytes[bodyStart]===13)bodyStart++;if(headBytes[bodyStart]===10)bodyStart++;
            const headerLines=headStr.substring(0,endIdx).split('\n');
            let vertexCount=0,propMap={},currentElement='',currentOffset=0,vertexStride=0;
            headerLines.forEach(line=>{const parts=line.trim().split(/\s+/);if(parts[0]==='element'){if(currentElement==='vertex')vertexStride=currentOffset;currentElement=parts[1];currentOffset=0;if(parts[1]==='vertex')vertexCount=parseInt(parts[2]);}else if(parts[0]==='property'){const size=(parts[1]==='double'?8:(parts[1]==='uchar'||parts[1]==='char'?1:4));if(currentElement==='vertex')propMap[parts[parts.length-1]]={offset:currentOffset};currentOffset+=size;}});
            if(currentElement==='vertex')vertexStride=currentOffset;
            const view=new DataView(buffer);const pos=new Float32Array(vertexCount*3),rot=new Float32Array(vertexCount*4),scl=new Float32Array(vertexCount*3),col=new Float32Array(vertexCount*4);
            let valid=0,offset=bodyStart;
            const off={x:propMap['x']?.offset,y:propMap['y']?.offset,z:propMap['z']?.offset,op:propMap['opacity']?.offset,dc0:propMap['f_dc_0']?.offset,rot0:propMap['rot_0']?.offset,s0:propMap['scale_0']?.offset};
            const hasRot=off.rot0!==undefined,hasScale=off.s0!==undefined,hasColor=off.dc0!==undefined;
            let cx=0,cy=0,cz=0;const sc=Math.min(vertexCount,10000);
            for(let i=0;i<vertexCount;i++){if(offset+vertexStride>buffer.byteLength)break;const x=view.getFloat32(offset+off.x,true);if(isNaN(x)){offset+=vertexStride;continue;}let opacity=1;if(off.op!==undefined)opacity=1/(1+Math.exp(-view.getFloat32(offset+off.op,true)));if(opacity<state.minOpacity){offset+=vertexStride;continue;}const py=view.getFloat32(offset+off.y,true),pz=view.getFloat32(offset+off.z,true);pos[valid*3]=x;pos[valid*3+1]=py;pos[valid*3+2]=pz;if(i<sc){cx+=x;cy+=py;cz+=pz;}if(hasRot){rot[valid*4]=view.getFloat32(offset+off.rot0+4,true);rot[valid*4+1]=view.getFloat32(offset+off.rot0+8,true);rot[valid*4+2]=view.getFloat32(offset+off.rot0+12,true);rot[valid*4+3]=view.getFloat32(offset+off.rot0,true);}else rot[valid*4+3]=1;if(hasScale){scl[valid*3]=Math.exp(view.getFloat32(offset+off.s0,true));scl[valid*3+1]=Math.exp(view.getFloat32(offset+off.s0+4,true));scl[valid*3+2]=Math.exp(view.getFloat32(offset+off.s0+8,true));}else scl.fill(0.1,valid*3,valid*3+3);if(hasColor){col[valid*4]=0.5+SH_C0*view.getFloat32(offset+off.dc0,true);col[valid*4+1]=0.5+SH_C0*view.getFloat32(offset+off.dc0+4,true);col[valid*4+2]=0.5+SH_C0*view.getFloat32(offset+off.dc0+8,true);}else col.fill(0.5,valid*4,valid*4+3);col[valid*4+3]=opacity;valid++;offset+=vertexStride;}
            const as=Math.min(sc,valid);return{count:valid,pos:pos.slice(0,valid*3),rot:rot.slice(0,valid*4),scale:scl.slice(0,valid*3),col:col.slice(0,valid*4),center:new THREE.Vector3(cx/as,cy/as,cz/as)};
        }

        function animate(){
            requestAnimationFrame(animate);
            const dt=Math.min(clock.getDelta(),0.1);
            updatePhysics(dt);
            let anyAnimating=false;
            models.forEach(m=>{
                if(!m.bufferMode)return;
                if(m.isAssembling){
                    m.assembleProgress+=dt/ASSEMBLE_DURATION;
                    if(m.assembleProgress>=1){m.assembleProgress=1;m.isAssembling=false;m.assembled=true;
                        if(demo.active)demo.state='assembled';}
                    anyAnimating=true;
                }
                if(m._translating){
                    m._translateProgress=Math.min(1,m._translateProgress+dt/2);
                    m.posOffset[2]=-m._translateProgress*10;
                    if(m.mesh)m.mesh.material.uniforms.uPosOffset.value.fromArray(m.posOffset);
                    if(m._translateProgress>=1){
                        m._translating=false;
                        m.disassembling=true;
                        // 消散开始时才加载下一个场景
                        const nIdx=(demo.index+1)%models.length;
                        const nM=models[nIdx];
                        if(nM&&nM!==m){
                            nM.assembleProgress=0;
                            nM.assembled=false;
                            nM._enterProgress=0;
                            const nmM=createSplatMesh(nM.geometryData,0,true);
                            const nmG=new THREE.Group();nmG.add(nmM);scene.add(nmG);
                            nM.mesh=nmM;
                            nM.visible=true;
                            nmM.material.uniforms.uOpacityMod.value=0;
                        }
                    }
                    anyAnimating=true;
                }
                if(m.disassembling){
                    m.assembleProgress-=dt/ASSEMBLE_DURATION;
                    m._fadeOpacity=m.assembleProgress;
                    if(m.assembleProgress<=0){m.assembleProgress=0;m._fadeOpacity=0;m.disassembling=false;m.assembled=false;
                        if(demo.active){
                            let nextIdx=demo.index+1;
                            if(nextIdx>=models.length)nextIdx=0;
                            demo.index=nextIdx;
                            demo.state='idle';
                            // Remove current (disassembled) mesh, keep next
                            const toDel=[];
                            scene.children.forEach(c=>{if(c.type==='Group'&&c.children[0]===m.mesh)toDel.push(c);});
                            toDel.forEach(c=>{c.children.forEach(ch=>{if(ch.geometry)ch.geometry.dispose();if(ch.material)ch.material.dispose();});scene.remove(c);});
                            updateAssembleStatus();
                        }}
                    anyAnimating=true;
                }
            });
            if(anyAnimating){updateUniforms();updateAssembleStatus();updateModelListUI();}
            const lerpSpeed=0.5*dt;currentTurbulence+=(state.turbulence-currentTurbulence)*lerpSpeed;
            // Compute pulse from music + drum detection
            if(rhythmEnabled&&analyser&&audioPlayer&&!audioPlayer.paused){
                const fd=new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(fd);
                // Overall energy → base pulse
                let sum=0;for(let i=0;i<fd.length;i++)sum+=fd[i];
                const avg=sum/fd.length;
                currentPulse+=(avg/128*rhythmSensitivity-currentPulse)*0.15;
                // Low-frequency drum detection (bins 1-4 ≈ 60-340Hz)
                let lowSum=0;for(let i=1;i<5;i++)lowSum+=fd[i];
                const lowEnergy=lowSum/4;
                drumAvg+=(lowEnergy-drumAvg)*0.08;
                if(drumAvg>3&&lowEnergy>drumAvg*drumThreshold){
                    drumHit=1.0;
                    // Drum trigger in demo mode
                    if(demo.active&&demo.state==='idle'){demo.state='assembling';models[demo.index]&&(models[demo.index].isAssembling=true);}else if(demo.active&&demo.state==='assembled'){startAssemble();}
                }
                drumHit*=0.88;
                // Boost currentPulse on drum hit
                currentPulse=Math.max(currentPulse,drumHit*0.6);
            }else{currentPulse+=(-currentPulse)*0.15;drumHit*=0.88;}
            const elapsed=clock.getElapsedTime();
            const rhythmHeight=state.effectRhythm>0.5?currentPulse*state.rhythmSway*5:0;
            models.forEach(m=>{if(m.mesh){
                const u=m.mesh.material.uniforms;
                u.uTurbulence.value=currentTurbulence;u.uTime.value=elapsed;u.uPulse.value=currentPulse;
                u.uOpacityMod.value=state.opacity*m.opacity*(m._fadeOpacity!==undefined?m._fadeOpacity:1);
                u.uEffectWave.value=m.effectWave;u.uWaveAmp.value=state.waveAmp;u.uWaveFreq.value=state.waveFreq;u.uWaveSpeed.value=state.waveSpeed;
                u.uEffectRhythm.value=m.effectRhythm;u.uRhythmHeight.value=rhythmHeight;
                u.uEffectHeartbeat.value=m.effectHeartbeat;u.uHbRate.value=state.hbRate;u.uHbAmp.value=state.hbAmp;
                u.uRotationEffect.value=m.rotationEffect;u.uRotSpeed.value=state.rotSpeed;
                    u.uMoveEffect.value=0;
                u.uColorTint.value.fromArray(m.colorTint);
                u.uPosOffset.value.fromArray(m.posOffset);
                const _styleMap={sphere:0,explode:1,swirl:2,fade:3};
                u.uDisassembleStyle.value=demo.active?_styleMap[demo.disassembleStyle]||0:0;
                if(m._enterProgress!==undefined&&m._enterProgress<1){
                    m._enterProgress=Math.min(1,m._enterProgress+dt/3);
                }
                u.uOpacityMod.value*=m._enterProgress!==undefined?m._enterProgress:1;
                m.mesh.visible=m.visible!==false;
            }});
            renderer.render(scene,camera);
        }
        document.getElementById('music-upload-btn').addEventListener('click',()=>{
            const inp=document.getElementById('music-input');
            inp.value='';
            inp.click();
        });
        document.getElementById('music-input').addEventListener('change',function(e){
            const file=this.files[0];if(!file)return;
            const url=URL.createObjectURL(file);
            if(audioPlayer){audioPlayer.pause();audioPlayer=null;}
            // Tear down old AudioContext
            if(audioCtx){audioCtx.close();audioCtx=null;analyser=null;}
            audioPlayer=new Audio(url);audioPlayer.loop=true;audioPlayer.volume=parseFloat(document.getElementById('music-vol').value);
            // Set up Web Audio analysis
            try{
                audioCtx=new(window.AudioContext||window.webkitAudioContext)();
                analyser=audioCtx.createAnalyser();
                analyser.fftSize=256;
                const src=audioCtx.createMediaElementSource(audioPlayer);
                src.connect(analyser);
                analyser.connect(audioCtx.destination);
            }catch(e){audioCtx=null;analyser=null;}
            document.getElementById('music-name').textContent=file.name;
            document.getElementById('music-play-btn').textContent='▶';document.getElementById('music-play-btn').classList.remove('playing');
            audioPlayer.addEventListener('ended',()=>{document.getElementById('music-play-btn').textContent='▶';document.getElementById('music-play-btn').classList.remove('playing');});
        });
        document.getElementById('music-play-btn').addEventListener('click',toggleMusic);
        document.getElementById('music-vol').addEventListener('input',function(){if(audioPlayer)audioPlayer.volume=parseFloat(this.value);});
        function toggleMusic(){
            if(!audioPlayer)return;
            const btn=document.getElementById('music-play-btn');
            if(audioPlayer.paused){
                if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
                audioPlayer.play();btn.textContent='⏸';btn.classList.add('playing');
            }
            else{audioPlayer.pause();btn.textContent='▶';btn.classList.remove('playing');}
        }
        document.getElementById('rhythm-btn').addEventListener('click',function(){
            rhythmEnabled=!rhythmEnabled;
            this.classList.toggle('rhythm-on',rhythmEnabled);
            document.getElementById('rhythm-row').classList.toggle('active',rhythmEnabled);
        });
        document.getElementById('rhythm-sens').addEventListener('input',function(){
            rhythmSensitivity=parseFloat(this.value);
            document.getElementById('rhythm-val').textContent=rhythmSensitivity.toFixed(1);
        });
    </script>
</body>
</html>
